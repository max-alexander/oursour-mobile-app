spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=usuario-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usuario-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[1].id=catalogo-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://catalogo-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.server.webmvc.routes[2].id=receta-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://receta-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/recetas/**

spring.cloud.gateway.server.webmvc.routes[3].id=pedido-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://pedido-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/pedidos/**

management.endpoints.web.exposure.include=health,info
